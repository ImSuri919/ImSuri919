<svg xmlns="http://www.w3.org/2000/svg" width="880" height="12" viewBox="0 0 880 12" role="img" aria-label="Animated neon divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="880" height="12" fill="none"/>
  <rect x="0" y="5" width="880" height="2" rx="1" fill="url(#line)" filter="url(#glow)" opacity=".85">
    <animate attributeName="opacity" values=".45;1;.45" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <circle cy="6" r="4" fill="#22d3ee" filter="url(#glow)">
    <animate attributeName="cx" values="40;840;40" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
